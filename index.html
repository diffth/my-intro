<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>홍길동 · 자기소개</title>
<meta name="description" content="코드와 커피, 책과 산책을 좋아합니다." />

<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
/>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>

<style>
  :root {
    --bg-from: #f8fafc;
    --bg-to: #e0f2fe;
    --accent: #0ea5e9;
    --accent-soft: rgba(14, 165, 233, 0.12);
    --text: #1e293b;
    --text-muted: #64748b;
    --card-bg: rgba(255, 255, 255, 0.72);
    --card-border: rgba(255, 255, 255, 0.7);
    --card-shadow: 0 20px 45px -20px rgba(15, 23, 42, 0.28),
                   0 8px 20px -12px rgba(15, 23, 42, 0.16);
    --card-shadow-hover: 0 34px 60px -22px rgba(14, 165, 233, 0.35),
                         0 12px 26px -14px rgba(15, 23, 42, 0.2);
    --radius: 24px;
    --font: "Pretendard Variable", Pretendard, "Noto Sans KR", -apple-system,
      BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Helvetica Neue",
      "Apple SD Gothic Neo", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding: 32px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font);
    color: var(--text);
    background: linear-gradient(160deg, var(--bg-from) 0%, var(--bg-to) 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    position: relative;
    overflow-x: hidden;
  }

  /* 배경 떠다니는 점들 */
  .bg-particles {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(125, 211, 252, 0.85) 0%, rgba(14, 165, 233, 0.45) 60%, rgba(14, 165, 233, 0.1) 100%);
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
    opacity: 0.55;
    animation: floatParticle var(--duration, 20s) ease-in-out infinite alternate;
    will-change: transform, opacity;
  }

  @keyframes floatParticle {
    0% {
      transform: translate3d(0, 0, 0) scale(1);
    }
    33% {
      transform: translate3d(var(--tx1, 20px), var(--ty1, -30px), 0) scale(1.1);
    }
    66% {
      transform: translate3d(var(--tx2, -25px), var(--ty2, -60px), 0) scale(0.92);
    }
    100% {
      transform: translate3d(var(--tx3, 15px), var(--ty3, -90px), 0) scale(1.05);
    }
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 44px 36px 38px;
    text-align: center;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow: var(--card-shadow);
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .card:hover,
  .card:focus-within {
    transform: translateY(-8px);
    box-shadow: var(--card-shadow-hover);
  }

  .avatar {
    width: 92px;
    height: 92px;
    margin: 0 auto 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8 0%, var(--accent) 55%, #0284c7 100%);
    color: #fff;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.02em;
    box-shadow: 0 12px 28px -12px rgba(14, 165, 233, 0.75);
    user-select: none;
  }

  .name {
    margin: 0 0 10px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .bio {
    margin: 0 0 26px;
    font-size: 15px;
    line-height: 1.65;
    color: var(--text-muted);
    word-break: keep-all;
  }

  .tags {
    list-style: none;
    margin: 0 0 30px;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }

  .tags li { list-style: none; }
  .tags li::marker { content: ""; }

  .tag {
    display: inline-block;
    padding: 7px 15px;
    border-radius: 999px;
    background: var(--accent-soft);
    border: 1px solid rgba(14, 165, 233, 0.22);
    color: #0369a1;
    font-size: 13px;
    font-weight: 600;
    line-height: 1;
    white-space: nowrap;
    cursor: default;
    opacity: 0.82;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.3s ease,
                background-color 0.25s ease,
                color 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
    will-change: transform, opacity;
  }

  /* 카드에 호버 시 태그들이 왼쪽부터 순서대로 떠오르는 Stagger 애니메이션 */
  .card:hover .tags li:nth-child(1) .tag {
    transform: translateY(-5px);
    opacity: 1;
    transition-delay: 0.03s;
  }
  .card:hover .tags li:nth-child(2) .tag {
    transform: translateY(-5px);
    opacity: 1;
    transition-delay: 0.09s;
  }
  .card:hover .tags li:nth-child(3) .tag {
    transform: translateY(-5px);
    opacity: 1;
    transition-delay: 0.15s;
  }
  .card:hover .tags li:nth-child(4) .tag {
    transform: translateY(-5px);
    opacity: 1;
    transition-delay: 0.21s;
  }
  .card:hover .tags li:nth-child(5) .tag {
    transform: translateY(-5px);
    opacity: 1;
    transition-delay: 0.27s;
  }
  .card:hover .tags li:nth-child(6) .tag {
    transform: translateY(-5px);
    opacity: 1;
    transition-delay: 0.33s;
  }

  .tag:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    transform: translateY(-2px);
  }

  .socials {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .social {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(148, 163, 184, 0.35);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: background-color 0.25s ease, color 0.25s ease,
                border-color 0.25s ease, transform 0.25s ease,
                box-shadow 0.25s ease;
  }

  .social svg {
    width: 18px;
    height: 18px;
    flex: none;
    fill: currentColor;
  }

  .social:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    transform: translateY(-2px);
    box-shadow: 0 10px 20px -10px rgba(14, 165, 233, 0.7);
  }

  .social:focus-visible,
  .tag:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  @media (max-width: 480px) {
    body { padding: 24px 14px; }

    .card { padding: 34px 20px 30px; border-radius: 20px; }

    .avatar { width: 78px; height: 78px; font-size: 29px; margin-bottom: 18px; }

    .name { font-size: 24px; }

    .bio { font-size: 14px; margin-bottom: 22px; }

    .tag { padding: 6px 13px; font-size: 12.5px; }

    .socials { flex-direction: column; align-items: stretch; }

    .social { justify-content: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <!-- 카드 뒤쪽 배경에 떠다니는 점 30개 컨테이너 -->
  <div class="bg-particles" id="particles" aria-hidden="true"></div>

  <main class="card">
    <div class="avatar" aria-hidden="true">홍</div>

    <h1 class="name">홍길동</h1>
    <p class="bio">코드와 커피, 책과 산책을 좋아합니다.</p>

    <ul class="tags" aria-label="관심사">
      <li><span class="tag">독서</span></li>
      <li><span class="tag">여행</span></li>
      <li><span class="tag">사진</span></li>
      <li><span class="tag">커피</span></li>
    </ul>

    <nav class="socials" aria-label="소셜 링크">
      <a class="social" href="https://github.com/claudecode-gilbut" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.2.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/></svg>
        <span>Github</span>
      </a>
      <a class="social" href="https://linkedin.com/in/claudecode-gilbut" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.42v1.56h.05a3.75 3.75 0 0 1 3.37-1.85c3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14ZM7.12 20.45H3.55V9h3.57v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0Z"/></svg>
        <span>LinkedIn</span>
      </a>
    </nav>
  </main>

  <script>
    // 배경에 떠다니는 작은 점 30개 동적 생성
    (function createFloatingDots() {
      const container = document.getElementById('particles');
      if (!container) return;
      
      const DOT_COUNT = 30;
      const fragment = document.createDocumentFragment();

      for (let i = 0; i < DOT_COUNT; i++) {
        const dot = document.createElement('div');
        dot.className = 'particle';

        // 크기: 4px ~ 14px 다양하게 설정
        const size = Math.floor(Math.random() * 11) + 4;
        
        // 초기 위치 (0% ~ 100%)
        const posX = (Math.random() * 100).toFixed(2);
        const posY = (Math.random() * 100).toFixed(2);

        // 떠다니는 주기: 16초 ~ 36초
        const duration = (Math.random() * 20 + 16).toFixed(1);
        
        // 이미 떠다니는 중인 것처럼 보이기 위해 음수 딜레이 적용 (-30s ~ 0s)
        const delay = (-(Math.random() * 30)).toFixed(1);

        // 은은한 투명도 (0.2 ~ 0.6)
        const opacity = (Math.random() * 0.4 + 0.2).toFixed(2);

        dot.style.width = `${size}px`;
        dot.style.height = `${size}px`;
        dot.style.left = `${posX}%`;
        dot.style.top = `${posY}%`;
        dot.style.opacity = opacity;
        dot.style.setProperty('--duration', `${duration}s`);
        dot.style.animationDelay = `${delay}s`;

        // 점마다 고유한 궤적 파라미터 (CSS 변수)
        const tx1 = (Math.random() * 80 - 40).toFixed(0);
        const ty1 = (Math.random() * 80 - 40).toFixed(0);
        const tx2 = (Math.random() * 100 - 50).toFixed(0);
        const ty2 = (Math.random() * 100 - 50).toFixed(0);
        const tx3 = (Math.random() * 60 - 30).toFixed(0);
        const ty3 = (Math.random() * 60 - 30).toFixed(0);

        dot.style.setProperty('--tx1', `${tx1}px`);
        dot.style.setProperty('--ty1', `${ty1}px`);
        dot.style.setProperty('--tx2', `${tx2}px`);
        dot.style.setProperty('--ty2', `${ty2}px`);
        dot.style.setProperty('--tx3', `${tx3}px`);
        dot.style.setProperty('--ty3', `${ty3}px`);

        fragment.appendChild(dot);
      }

      container.appendChild(fragment);
    })();
  </script>
</body>
</html>
